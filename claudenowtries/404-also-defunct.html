<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    var path = window.location.pathname;
    if (path.includes('/connect/')) {
      // Rewrite e.g. /webcontainer/connect/abc123
      // to /wcptvs/claudenowtries/connect/abc123
      // so the SW (scoped to /wcptvs/) can intercept and serve connect.html
      var token = path.split('/connect/')[1];
      window.location.replace('/wcptvs/claudenowtries/connect/' + token);
    }
  </script>
</head>
<body></body>
</html>
