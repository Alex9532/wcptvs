<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connecting…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0f12;
      font-family: 'Berkeley Mono', monospace;
      color: #545b6b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <span>connecting to webcontainer…</span>
  <script type="module">
    // IMPORTANT: this page must NOT be cross-origin isolated.
    // The service worker serves it with COEP: unsafe-none for this reason.
    import { setupConnect } from 'https://esm.sh/@webcontainer/api/connect';

    // The token arrives as ?token=... because the SW can't intercept
    // /webcontainer/connect/* (it's outside our scope on GitHub Pages).
    const token = new URLSearchParams(window.location.search).get('token');
    if (token) {
      // Reconstruct the canonical connect URL that setupConnect expects
      const connectUrl = window.location.origin + '/webcontainer/connect/' + token;
      history.replaceState(null, '', '/webcontainer/connect/' + token);
    }
    setupConnect();
  </script>
</body>
</html>
