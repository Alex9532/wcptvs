<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connecting…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0f12;
      font-family: 'Berkeley Mono', monospace;
      color: #545b6b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <span>connecting to webcontainer…</span>
  <script type="module">
    import { setupConnect } from 'https://esm.sh/@webcontainer/api/connect';
    // After the handshake completes, navigate the popup to the actual server URL.
    const serverUrl = new URLSearchParams(window.location.search).get('url');
    await setupConnect();
    if (serverUrl) window.location.replace(serverUrl);
  </script>
</body>
</html>
