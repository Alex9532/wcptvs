<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Connecting…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;background:#0d0f12;font-family:monospace;color:#545b6b;font-size:13px}
</style>
</head>
<body>
<span id="msg">activating…</span>
<script>
  const serverUrl = new URLSearchParams(window.location.search).get('serverUrl');

  async function run() {
    // Register and wait for the root-scoped SW to control this tab.
    // Once it does, /webcontainer/connect/* will be intercepted and served
    // inline by the SW — no external fetch, opener stays intact.
    const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });

    if (navigator.serviceWorker.controller) {
      navigate();
    } else {
      navigator.serviceWorker.addEventListener('controllerchange', navigate, { once: true });
      // If installing, wait for activation
      const sw = reg.installing || reg.waiting;
      if (sw) {
        sw.addEventListener('statechange', (e) => {
          if (e.target.state === 'activated') navigate();
        });
      }
    }
  }

  function navigate() {
    document.getElementById('msg').textContent = 'connecting…';
    // The SW intercepts this and responds with the inlined connect script.
    // window.replace navigates in-place so opener is preserved.
    window.location.replace(
      '/webcontainer/connect/direct?serverUrl=' + encodeURIComponent(serverUrl || '')
    );
  }

  run();
</script>
</body>
</html>
