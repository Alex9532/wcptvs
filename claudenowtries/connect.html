<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Connecting…</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center;
    justify-content:center; background:#0d0f12; font-family:monospace;
    color:#545b6b; font-size:13px; }
</style>
</head>
<body>
<span>connecting…</span>
<script type="module">
  import { setupConnect } from 'https://esm.sh/@webcontainer/api/connect';

  const params = new URLSearchParams(window.location.search);
  const serverUrl = params.get('serverUrl');

  // setupConnect() checks window.location.pathname starts with /webcontainer/connect/.
  // This page is served at /wcptvs/claudenowtries/connect.html so we spoof the path.
  // window.opener is intact because window.open() was used with no redirect.
  Object.defineProperty(window.location, 'pathname', {
    get: () => '/webcontainer/connect/direct',
    configurable: true,
  });

  await setupConnect();

  if (serverUrl) window.location.replace(serverUrl);
</script>
</body>
</html>
