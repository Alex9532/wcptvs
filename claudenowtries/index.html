<!DOCTYPE html>
<html lang="en">
<!-- Created by Claude, I adapted some of the code -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebContainer Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Berkeley+Mono:ital,wght@0,100..700;1,100..700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <script type="importmap">
    {
      "imports": {
        "@webcontainer/api": "https://esm.sh/@webcontainer/api",
        "jszip": "https://esm.sh/jszip",
        "fflate": "https://esm.sh/fflate"
      }
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f12;
      --surface:   #13161b;
      --border:    #1e2229;
      --border-hi: #2a2f3a;
      --text:      #c8cdd8;
      --text-dim:  #545b6b;
      --text-hi:   #eef0f4;
      --green:     #4ade80;
      --green-dim: #166534;
      --amber:     #fbbf24;
      --red:       #f87171;
      --blue:      #60a5fa;
      --cyan:      #22d3ee;
      --prompt:    #4ade80;
      --radius:    6px;
      --mono:      'Berkeley Mono', 'Fira Code', monospace;
      --sans:      'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Layout ── */
    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-hi);
      letter-spacing: 0.04em;
    }

    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }
    .logo-dot.booting { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1.2s ease-in-out infinite; }
    .logo-dot.error   { background: var(--red);   box-shadow: 0 0 8px var(--red); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .status-badge {
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-hi);
      color: var(--text-dim);
      background: var(--surface);
      transition: all .3s;
    }
    .status-badge.ready  { color: var(--green); border-color: var(--green-dim); background: #052e16; }
    .status-badge.error  { color: var(--red);   border-color: #7f1d1d; background: #1c0a0a; }
    .status-badge.booting { color: var(--amber); border-color: #78350f; background: #1c0e00; }

    .server-btn {
      display: none;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 12px 3px 8px;
      border-radius: 20px;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      background: #041e24;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, color .15s;
      white-space: nowrap;
      animation: fadeIn .3s ease;
    }
    .server-btn:hover { background: #072c38; color: #fff; border-color: #fff; }
    .server-btn.visible { display: flex; }
    .server-btn-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
      animation: pulse 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }

    /* ── Terminal ── */
    .terminal-wrap {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
    }

    .terminal {
      flex: 1;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.75;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      scroll-behavior: smooth;
    }

    /* Custom scrollbar */
    .terminal::-webkit-scrollbar { width: 6px; }
    .terminal::-webkit-scrollbar-track { background: transparent; }
    .terminal::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

    .line { display: flex; gap: 8px; align-items: baseline; padding: 0; }
    .line + .line { margin-top: 1px; }

    .line-prefix {
      flex-shrink: 0;
      color: var(--text-dim);
      user-select: none;
      font-size: 11px;
    }
    .line-prefix.cmd  { color: var(--prompt); }
    .line-prefix.sys  { color: var(--cyan); }
    .line-prefix.err  { color: var(--red); }

    .line-text { white-space: pre-wrap; word-break: break-all; color: var(--text); }
    .line-text.cmd  { color: var(--text-hi); font-weight: 500; }
    .line-text.sys  { color: var(--cyan); }
    .line-text.err  { color: var(--red); }
    .line-text.ok   { color: var(--green); }
    .line-text.dim  { color: var(--text-dim); }
    .line-text.amber { color: var(--amber); }

    /* separator */
    .sep {
      height: 1px;
      background: var(--border);
      margin: 10px 0;
      opacity: .6;
    }

    /* ── Input bar ── */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 20px;
      transition: border-color .15s;
    }
    .input-bar:focus-within { border-color: var(--border-hi); }

    .input-prompt {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--prompt);
      padding: 0 6px 0 14px;
      user-select: none;
      flex-shrink: 0;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-hi);
      font-family: var(--mono);
      font-size: 12.5px;
      padding: 11px 0;
      caret-color: var(--green);
    }
    #cmd-input::placeholder { color: var(--text-dim); }
    #cmd-input:disabled { opacity: .4; cursor: not-allowed; }

    .run-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      border-left: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--sans);
      font-size: 12px;
      padding: 0 14px;
      height: 100%;
      cursor: pointer;
      transition: color .15s, background .15s;
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    .run-btn:hover:not(:disabled) { color: var(--text-hi); background: var(--border); }
    .run-btn:disabled { opacity: .35; cursor: not-allowed; }
    .run-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* quick-action chips */
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .chip {
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 10px;
      border: 1px solid var(--border-hi);
      border-radius: 20px;
      color: var(--text-dim);
      background: transparent;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .chip:hover:not(:disabled) { color: var(--text-hi); border-color: var(--text-dim); }
    .chip:disabled { opacity: .3; cursor: not-allowed; }

    /* ── Zip upload ── */
    .upload-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .upload-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .upload-toggle input[type=checkbox] { display: none; }
    .toggle-track {
      width: 28px; height: 16px;
      background: var(--border-hi);
      border-radius: 8px;
      position: relative;
      transition: background .2s;
      flex-shrink: 0;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      background: var(--text-dim);
      border-radius: 50%;
      top: 3px; left: 3px;
      transition: transform .2s, background .2s;
    }
    .upload-toggle input:checked + .toggle-track { background: var(--cyan); }
    .upload-toggle input:checked + .toggle-track::after { transform: translateX(12px); background: #fff; }
    .upload-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 12px;
      border: 1px solid var(--border-hi);
      border-radius: 20px;
      color: var(--text-dim);
      background: transparent;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    .upload-btn:hover:not(:disabled) { color: var(--cyan); border-color: var(--cyan); }
    .upload-btn:disabled { opacity: .3; cursor: not-allowed; }
    .upload-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    #zip-input { display: none; }
    .upload-hint {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo">
      <div class="logo-dot booting" id="status-dot"></div>
      webcontainer / terminal v1.6.64
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <a class="server-btn" id="server-btn" target="_blank" rel="noopener">
        <span class="server-btn-dot"></span>
        open server
      </a>
      <div class="status-badge booting" id="status-badge">booting…</div>
    </div>
  </header>

  <div class="terminal-wrap">
    <div class="terminal" id="terminal"></div>
  </div>

  <div>
    <div class="upload-bar">
      <input type="file" id="zip-input" accept="*" />
      <button class="upload-btn" id="upload-btn" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2v8M5 5l3-3 3 3"/>
          <path d="M2 11v1a2 2 0 002 2h8a2 2 0 002-2v-1"/>
        </svg>
        upload file
      </button>
      <label class="upload-toggle" title="When on, .zip and .tgz files are unpacked into the container. When off, they are written as raw files.">
        <input type="checkbox" id="extract-toggle" checked />
        <span class="toggle-track"></span>
        extract archives
      </label>
      <span class="upload-hint" id="upload-hint">no file selected</span>
    </div>

    <div class="chips" id="chips">
      <button class="chip" disabled data-cmd="node --version">node --version</button>
      <button class="chip" disabled data-cmd="npm --version">npm --version</button>
      <button class="chip" disabled data-cmd="pnpm --version">pnpm --version</button>
      <button class="chip" disabled data-cmd="ls -la">ls -la</button>
      <button class="chip" disabled data-cmd="cat package.json">cat package.json</button>
      <button class="chip" disabled data-cmd="node -e &quot;console.log('hello from node!')&quot;">run node snippet</button>
    </div>

    <div class="input-bar">
      <span class="input-prompt" id="input-prompt">~&nbsp;$</span>
      <input id="cmd-input" type="text" placeholder="enter a command…" disabled autocomplete="off" spellcheck="false" />
      <button class="run-btn" id="run-btn" disabled>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="4,2 14,8 4,14" fill="currentColor" stroke="none"/>
        </svg>
        run
      </button>
    </div>
  </div>

</div>

<script type="module">
  import { WebContainer } from '@webcontainer/api';
  import JSZip from 'jszip';
  import { decompress, unzipSync } from 'fflate';

  const termEl    = document.getElementById('terminal');
  const input     = document.getElementById('cmd-input');
  const runBtn    = document.getElementById('run-btn');
  const dot       = document.getElementById('status-dot');
  const badge     = document.getElementById('status-badge');
  const chipBtns  = document.querySelectorAll('.chip');
  const uploadBtn     = document.getElementById('upload-btn');
  const zipInput      = document.getElementById('zip-input');
  const uploadHint    = document.getElementById('upload-hint');
  const extractToggle = document.getElementById('extract-toggle');
  const serverBtn     = document.getElementById('server-btn');

  let wc = null;
  let cwd = '/';

  function updatePrompt() {
    const display = cwd === '/' ? '~' : cwd.replace(/^\//, '');
    document.getElementById('input-prompt').textContent = display + ' $\u00a0';
  }

  // ── Logging helpers ──────────────────────────────────────────────
  function log(text, type = '') {
    const line = document.createElement('div');
    line.className = 'line';

    const prefix = document.createElement('span');
    const content = document.createElement('span');

    if (type === 'cmd') {
      prefix.className = 'line-prefix cmd';
      prefix.textContent = '$';
    } else if (type === 'sys') {
      prefix.className = 'line-prefix sys';
      prefix.textContent = '▸';
    } else if (type === 'err') {
      prefix.className = 'line-prefix err';
      prefix.textContent = '✕';
    } else {
      prefix.className = 'line-prefix';
      prefix.textContent = ' ';
    }

    content.className = 'line-text' + (type ? ' ' + type : '');
    content.textContent = text;

    line.append(prefix, content);
    termEl.appendChild(line);
    termEl.scrollTop = termEl.scrollHeight;
    return content;
  }

  function logSep() {
    const d = document.createElement('div');
    d.className = 'sep';
    termEl.appendChild(d);
  }

  function setReady() {
    dot.className = 'logo-dot';
    badge.className = 'status-badge ready';
    badge.textContent = 'ready';
    input.disabled = false;
    runBtn.disabled = false;
    chipBtns.forEach(b => b.disabled = false);
    uploadBtn.disabled = false;
    input.focus();
  }

  function setError(msg) {
    dot.className = 'logo-dot error';
    badge.className = 'status-badge error';
    badge.textContent = 'error';
    log(msg, 'err');
  }

  // ── Boot ────────────────────────────────────────────────────────
  async function boot() {
    log('Initialising WebContainer…', 'sys');

    try {
      wc = await WebContainer.boot();
      log('WebContainer booted ✓', 'ok');

      wc.on('server-ready', (port, url) => {
        log(`Server detected on port ${port} → ${url}`, 'sys');
        serverBtn.classList.add('visible');
        serverBtn.textContent = '';
        const dot2 = document.createElement('span');
        dot2.className = 'server-btn-dot';
        serverBtn.appendChild(dot2);
        serverBtn.appendChild(document.createTextNode(` :${port}`));
        serverBtn.onclick = (e) => {
          e.preventDefault();
          // Extract the connect token from the server URL and open connect.html
          // directly as a popup. This preserves window.opener (required by
          // setupConnect) because no redirect chain is involved — the popup
          // lands on connect.html immediately, within our SW scope.
          const token = url.match(/--([a-z0-9]+)\.local/)?.[1] || '';
          const connectUrl = new URL('./connect.html', window.location.href);
          connectUrl.searchParams.set('token', token);
          connectUrl.searchParams.set('serverUrl', url);
          window.open(connectUrl.href, '_blank', 'noopener=no');
        };
      });
    } catch (e) {
      setError('WebContainer.boot() failed: ' + e.message);
      return;
    }

    log('Mounting filesystem…', 'sys');
    await wc.mount({
      'package.json': {
        file: {
          contents: JSON.stringify({
            name: 'wc-terminal',
            version: '1.0.0',
            description: 'WebContainer interactive terminal',
          }, null, 2),
        },
      },
      'package-lock.json': {
        file: {
          contents: JSON.stringify({
            name: 'wc-terminal',
            version: '1.0.0',
            lockfileVersion: 2,
            requires: true,
            packages: {
              '': {
                name: 'wc-terminal',
                version: '1.0.0',
              },
            },
          }, null, 2),
        },
      },
    });
    log('Filesystem mounted ✓', 'ok');
    logSep();
    log('Container ready. Type a command below.', 'dim');
    logSep();
    setReady();
  }

  // ── Run a command ───────────────────────────────────────────────
  function escapeSh(p) {
    return "'" + p.replace(/'/g, "'\\''") + "'";
  }

  // Commands that launch an interactive REPL when called with no args
  const INTERACTIVE_REPLS = new Set(['node', 'python', 'python3', 'bash', 'sh']);

  async function runCommand(raw) {
    const cmd = raw.trim();
    if (!cmd) return;

    log(cmd, 'cmd');
    input.disabled = true;
    runBtn.disabled = true;
    chipBtns.forEach(b => b.disabled = true);

    // Intercept cd — shell built-in, can't be spawned directly.
    if (/^cd(\s|$)/.test(cmd)) {
      const target = cmd.slice(2).trim() || '/';
      try {
        const shellCmd = `cd ${escapeSh(cwd)} && cd ${escapeSh(target)} && pwd`;
        const proc = await wc.spawn('/bin/sh', ['-c', shellCmd], { env: spawnEnv });
        let resolved = '';
        let errOut = '';
        proc.output.pipeTo(new WritableStream({
          write(chunk) { resolved += chunk; }
        }));
        if (proc.stderr) {
          proc.stderr.pipeTo(new WritableStream({
            write(chunk) { errOut += chunk; }
          }));
        }
        const code = await proc.exit;
        if (code === 0) {
          cwd = resolved.trim();
          updatePrompt();
        } else {
          log(`cd: ${target}: No such file or directory`, 'err');
        }
      } catch (e) {
        log(e.message, 'err');
      }
      logSep();
      input.disabled = false;
      runBtn.disabled = false;
      chipBtns.forEach(b => b.disabled = false);
      input.focus();
      return;
    }

    // Detect bare interactive REPLs (e.g. "node" with no args)
    const argv = cmd.trim().split(/\s+/);
    const isInteractive = INTERACTIVE_REPLS.has(argv[0]) && argv.length === 1;

    const outLine = log('', '');
    let outputBuf = '';
    let inputWriter = null;

    try {
      const proc = await wc.spawn('/bin/sh', ['-c', `cd ${escapeSh(cwd)} && ${cmd}`], { env: spawnEnv });

      // Wire up stdin so interactive REPLs can receive input
      if (isInteractive && proc.input) {
        inputWriter = proc.input.getWriter();
        // Switch prompt to show we're in an interactive session
        document.getElementById('input-prompt').textContent = '… \u00a0';
        input.placeholder = 'send input… (Ctrl+D to exit)';
        input.disabled = false;
        runBtn.textContent = '';
        runBtn.disabled = false;

        // Ctrl+D sends EOF to the process
        input.addEventListener('keydown', function ctrlDHandler(e) {
          if (e.key === 'd' && e.ctrlKey) {
            e.preventDefault();
            inputWriter.close().catch(() => {});
            input.removeEventListener('keydown', ctrlDHandler);
          }
        });

        // Enter sends the line to the process stdin
        const sendLine = async () => {
          const line = input.value;
          input.value = '';
          log(line, 'cmd');
          try {
            await inputWriter.write(line + '\n');
          } catch {}
        };

        input.onkeydown = async (e) => {
          if (e.key === 'Enter') { e.preventDefault(); await sendLine(); }
        };
        runBtn.onclick = sendLine;
      }

      proc.output.pipeTo(new WritableStream({
        write(chunk) {
          outputBuf += stripAnsi(chunk);
          const lines = outputBuf.split('\n');
          outputBuf = lines.pop();
          for (const l of lines) {
            if (outLine.textContent === '') {
              outLine.textContent = l;
            } else {
              log(l);
            }
          }
          termEl.scrollTop = termEl.scrollHeight;
        }
      }));

      const code = await proc.exit;

      if (outputBuf) {
        if (outLine.textContent === '') outLine.textContent = outputBuf;
        else log(outputBuf);
      }
      if (code !== 0) log(`exited with code ${code}`, 'err');

    } catch (e) {
      log(e.message, 'err');
    }

    // Restore normal terminal state after process exits
    if (isInteractive) {
      input.onkeydown = null;
      runBtn.onclick = null;
      runBtn.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="4,2 14,8 4,14" fill="currentColor" stroke="none"/></svg> run`;
      input.placeholder = 'enter a command…';
      updatePrompt();
    }

    logSep();
    input.disabled = false;
    runBtn.disabled = false;
    chipBtns.forEach(b => b.disabled = false);
    input.focus();
  }

  // ── Service Worker registration + reload guard ──────────────────
  async function ensureCrossOriginIsolated() {
    if (crossOriginIsolated) return true;

    if (!('serviceWorker' in navigator)) {
      setError('Service workers not supported — cannot achieve cross-origin isolation.');
      return false;
    }

    // sw.js must live at the repo root (/sw.js) so its scope covers /
    // including /webcontainer/connect/* which WebContainer hardcodes.
    // A SW can only control pages within its scope, and scope can't exceed
    // the SW script's own directory without a Service-Worker-Allowed header
    // (which GitHub Pages doesn't support).
    const reg = await navigator.serviceWorker.register('./sw.js');

    if (!navigator.serviceWorker.controller) {
      await new Promise(resolve => {
        const sw = reg.installing || reg.waiting;
        if (!sw) { resolve(); return; }
        sw.addEventListener('statechange', e => {
          if (e.target.state === 'activated') resolve();
        });
      });
      location.reload();
      return false;
    }

    return true;
  }

  // ── Event listeners ─────────────────────────────────────────────
  runBtn.addEventListener('click', () => {
    const v = input.value;
    input.value = '';
    runCommand(v);
  });

  // ── Command history ──────────────────────────────────────────────
  const history = [];
  let historyIdx = -1;
  let historySaved = ''; // preserves draft while browsing history

  input.addEventListener('keydown', e => {
    // Skip if runCommand has installed its own interactive handler
    if (input.onkeydown) return;

    if (e.key === 'Enter') {
      const v = input.value;
      input.value = '';
      historyIdx = -1;
      historySaved = '';
      if (v.trim()) {
        history.unshift(v); // newest first
      }
      runCommand(v);
      return;
    }

    if (e.key === 'ArrowUp') {
      if (input.onkeydown) return;
      e.preventDefault();
      if (!history.length) return;
      if (historyIdx === -1) historySaved = input.value;
      historyIdx = Math.min(historyIdx + 1, history.length - 1);
      input.value = history[historyIdx];
      // move cursor to end
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
      return;
    }

    if (e.key === 'ArrowDown') {
      if (input.onkeydown) return;
      e.preventDefault();
      if (historyIdx === -1) return;
      historyIdx--;
      input.value = historyIdx === -1 ? historySaved : history[historyIdx];
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
      return;
    }
  });

  chipBtns.forEach(btn => {
    btn.addEventListener('click', () => runCommand(btn.dataset.cmd));
  });

  const spawnEnv = {
    npm_config_progress: 'false',
    TERM: 'dumb',
    HOME: '/home',
    PATH: '/usr/local/bin:/usr/bin:/bin',
  };

  // ── ANSI escape code stripper ────────────────────────────────────
  const ansiRe = /[\x1b\x9b](?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])/g;
  function stripAnsi(str) {
    return str.replace(ansiRe, '').replace(/\r/g, '');
  }
  function setDeep(obj, parts, value) {
    const [head, ...rest] = parts;
    if (rest.length === 0) {
      obj[head] = value;
    } else {
      if (!obj[head]) obj[head] = { directory: {} };
      setDeep(obj[head].directory, rest, value);
    }
  }

  async function zipToMountTree(zip) {
    const tree = {};
    const tasks = [];
    zip.forEach((relativePath, entry) => {
      if (relativePath.startsWith('__MACOSX/')) return;
      if (entry.dir) {
        setDeep(tree, relativePath.replace(/\/$/, '').split('/'), { directory: {} });
      } else {
        tasks.push(
          entry.async('uint8array').then((contents) => {
            setDeep(tree, relativePath.split('/'), { file: { contents } });
          })
        );
      }
    });
    await Promise.all(tasks);
    return tree;
  }

  uploadBtn.addEventListener('click', () => zipInput.click());

  // ── File upload handler ──────────────────────────────────────────
  function lockUI() {
    uploadBtn.disabled = true;
    input.disabled = true;
    runBtn.disabled = true;
    chipBtns.forEach(b => b.disabled = true);
  }

  function unlockUI() {
    uploadBtn.disabled = false;
    input.disabled = false;
    runBtn.disabled = false;
    chipBtns.forEach(b => b.disabled = false);
    zipInput.value = '';
    input.focus();
  }

  // Read a File into a Uint8Array
  function readFileBytes(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(new Uint8Array(r.result));
      r.onerror = () => reject(new Error('Failed to read file'));
      r.readAsArrayBuffer(file);
    });
  }

  // Parse a .tar byte stream (after gunzip) into a mount tree.
  // tar format: 512-byte headers followed by file data padded to 512-byte blocks.
  function parseTar(buffer) {
    const tree = {};
    let offset = 0;
    const view = buffer;

    function readStr(start, len) {
      let end = start;
      while (end < start + len && view[end] !== 0) end++;
      return new TextDecoder().decode(view.slice(start, end));
    }

    while (offset + 512 <= view.length) {
      const name = readStr(offset, 100).trim();
      if (!name) break; // end-of-archive

      const sizeOctal = readStr(offset + 124, 12).trim();
      const size = parseInt(sizeOctal, 8) || 0;
      const typeFlag = String.fromCharCode(view[offset + 156]);

      offset += 512; // advance past header

      const isDir = typeFlag === '5' || name.endsWith('/');
      const cleanName = name.replace(/\/$/, '');
      const parts = cleanName.split('/').filter(Boolean);

      // Skip __MACOSX and .DS_Store noise
      if (!parts.length || parts[0] === '__MACOSX' || parts[parts.length - 1] === '.DS_Store') {
        offset += Math.ceil(size / 512) * 512;
        continue;
      }

      if (isDir) {
        setDeep(tree, parts, { directory: {} });
      } else if (typeFlag === '0' || typeFlag === '\0' || typeFlag === '') {
        const contents = view.slice(offset, offset + size);
        setDeep(tree, parts, { file: { contents } });
      }

      offset += Math.ceil(size / 512) * 512;
    }

    return tree;
  }

  zipInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    uploadHint.textContent = file.name;
    lockUI();
    logSep();
    log(`Uploading ${file.name}…`, 'sys');

    const name = file.name.toLowerCase();
    const isTgz = name.endsWith('.tgz') || name.endsWith('.tar.gz');
    const isZip = name.endsWith('.zip');
    const shouldExtract = extractToggle.checked && (isTgz || isZip);

    try {
      if (isZip && shouldExtract) {
        // ── ZIP ──────────────────────────────────────────────────
        let zip;
        try {
          zip = await JSZip.loadAsync(file);
        } catch (err) {
          log('Failed to parse zip: ' + err.message, 'err');
          unlockUI(); return;
        }
        const fileCount = Object.values(zip.files).filter(f => !f.dir && !f.name.startsWith('__MACOSX/')).length;
        log(`Unpacking ${fileCount} file${fileCount !== 1 ? 's' : ''}…`, 'sys');
        const tree = await zipToMountTree(zip);
        log('Mounting into WebContainer…', 'sys');
        await wc.mount(tree);
        log(`Mounted ${file.name} ✓`, 'ok');

      } else if (isTgz && shouldExtract) {
        // ── TGZ / TAR.GZ ─────────────────────────────────────────
        const compressed = await readFileBytes(file);
        log('Decompressing…', 'sys');
        const tarBytes = await new Promise((resolve, reject) => {
          decompress(compressed, (err, data) => err ? reject(err) : resolve(data));
        });
        log('Parsing tar archive…', 'sys');
        const tree = parseTar(tarBytes);
        const fileCount = countFiles(tree);
        log(`Unpacking ${fileCount} file${fileCount !== 1 ? 's' : ''}…`, 'sys');
        log('Mounting into WebContainer…', 'sys');
        await wc.mount(tree);
        log(`Mounted ${file.name} ✓`, 'ok');

      } else {
        // ── Plain file — write directly into cwd ─────────────────
        const bytes = await readFileBytes(file);
        const destPath = file.name;
        await wc.fs.writeFile(destPath, bytes);
        log(`Wrote ${file.name} (${bytes.length} bytes) into container root ✓`, 'ok');
      }
    } catch (err) {
      log('Upload failed: ' + err.message, 'err');
    }

    logSep();
    unlockUI();
  });

  // Count leaf files in a mount tree
  function countFiles(tree) {
    let n = 0;
    for (const v of Object.values(tree)) {
      if (v.file) n++;
      else if (v.directory) n += countFiles(v.directory);
    }
    return n;
  }

  // ── Init ────────────────────────────────────────────────────────
  const ok = await ensureCrossOriginIsolated();
  if (ok) boot();
</script>
</body>
